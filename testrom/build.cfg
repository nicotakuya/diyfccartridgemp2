# build.cfg

MEMORY {
    # RAM
    ZP:     start = $0000, size = $0020, type = rw, define = yes;
    RAM:    start = $0400, size = $0400, type = rw, define = yes;
    STACK:  start = $0200, size = $0200, type = rw, define = yes;

    # iNES ƒwƒbƒ_
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;

    # PRG-ROM
    PRG0:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7:   start = $C000, size = $3FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMINFO:start = $FFFA, size = $0006, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, define = yes;

    BANK0:    load = PRG0,   type = ro, optional = yes;
    BANK1:    load = PRG1,   type = ro, optional = yes;
    BANK2:    load = PRG2,   type = ro, optional = yes;
    BANK3:    load = PRG3,   type = ro, optional = yes;
    BANK4:    load = PRG4,   type = ro, optional = yes;
    BANK5:    load = PRG5,   type = ro, optional = yes;
    BANK6:    load = PRG6,   type = ro, optional = yes;

    # BANK7
    STARTUP:  load = PRG7,   type = ro,  define = yes;
    CODE:     load = PRG7,   type = ro;
    RODATA:   load = PRG7,   type = ro;
    DATA:     load = PRG7,   run = RAM, type = rw, define = yes;
    VECINFO: load = ROMINFO, type = ro,  define = yes;
}

FEATURES {
    CONDES: segment = RODATA,
        type = constructor,
        label = __CONSTRUCTOR_TABLE__,
        count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
        type = destructor,
        label = __DESTRUCTOR_TABLE__,
        count = __DESTRUCTOR_COUNT__;
}
